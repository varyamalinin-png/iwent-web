<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join GreenNest — GreenNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="auth-page">
  <div class="container auth-card">
    <a class="back-link" href="index.html" aria-label="Назад"></a>
    <h1 class="auth-card__title">Join to GreenNest</h1>
    <p class="auth-card__subtitle">Create an account to start your gardening journey</p>
    <form class="auth-form" action="#">
      <div class="form__field">
        <label class="form__label" for="signup-name">Full Name</label>
        <input class="form__input form__input--white" id="signup-name" type="text" autocomplete="name" placeholder="Full Name">
      </div>
      <div class="form__field">
        <label class="form__label" for="signup-email">E-mail</label>
        <input class="form__input form__input--white" id="signup-email" type="email" autocomplete="email" placeholder="your@gmail.com">
      </div>
      <div class="form__field">
        <label class="form__label" for="signup-password">Password</label>
        <input class="form__input form__input--white" id="signup-password" type="password" autocomplete="new-password">
      </div>
      <div class="form__actions form__actions--split">
        <a class="button button--outline-dark" href="sign-in.html">Already Have an account?</a>
        <button class="button button--gradient" type="submit">Create Account</button>
      </div>
    </form>
  </div>
</main>

</body>
</html>
